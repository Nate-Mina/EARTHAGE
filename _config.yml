# ---------------------------------------------------------------------------
# Earth Age — GitHub Pages / Jekyll configuration
# Single self-contained page (index.html, layout: none) with its own dark-mode
# styling. No Jekyll theme is required; the page carries its own design.
# ---------------------------------------------------------------------------

title: "Short-Timescale Geochronology"
description: >-
  A dark-mode data explorer presenting physical, genomic, and chronometric
  evidence for an Earth roughly 6,000 years old (or less).
author: "Nathaniel Mina"

plugins:
  - jekyll-feed

# Keep repo/maintenance files out of the built site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
